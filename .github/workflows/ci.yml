name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---- 后端:真实 postgres + qdrant 服务容器上跑 95 个测试(全 fake LLM,无真实密钥)----
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: docagent
          POSTGRES_PASSWORD: docagent_dev_password
          POSTGRES_DB: docagent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docagent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      qdrant:
        image: qdrant/qdrant:v1.13.0
        ports:
          - 6333:6333
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: docagent
      POSTGRES_PASSWORD: docagent_dev_password
      POSTGRES_DB: docagent
      QDRANT_URL: http://localhost:6333
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  # ---- 前端:Vite 生产构建 ----
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  # ---- 静态检查:ruff(根目录 ruff.toml 规则)----
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff
        run: ruff check backend

  # ---- 镜像构建:Dockerfile 可复现性 ----
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t docagent-backend ./backend
      - name: Build frontend image
        run: docker build -t docagent-frontend ./frontend
